# Local development topology. Mirrors production (deploy/docker-compose.prod.yml)
# except that Postgres is bound to loopback so you can psql into it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehiclesearch
      POSTGRES_USER: vsearch
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    # Bound to 127.0.0.1 deliberately: Docker's port publishing writes its own
    # iptables rules in DOCKER-USER and bypasses ufw, so "0.0.0.0:5432:5432"
    # would be reachable from the internet on a VPS even with ufw deny in place.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsearch -d vehiclesearch"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

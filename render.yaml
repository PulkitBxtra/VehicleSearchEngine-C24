# Render blueprint: a static frontend and a Dockerised API as separate services.
#
# Because they are separate origins, the API must allowlist the frontend's URL
# via CORS_ALLOWED_ORIGINS, and the frontend must be built with the API's URL in
# VITE_API_BASE_URL. Those two values reference each other — set them after the
# first deploy assigns the hostnames.
#
# Verify against Render's current blueprint schema before relying on this;
# field names there do change.
services:
  - type: web
    name: vehicle-search-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Match the database's region. Neon here is ap-southeast-1, and a
    # cross-region hop costs more than every query this service runs.
    region: singapore
    # Free instances sleep after ~15 minutes idle and a JVM cold start is
    # 40-60s. Acceptable for a personal demo, poor for a link someone opens
    # once and judges.
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL          # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false          #   drop channel_binding: the JDBC driver rejects it
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # the static site's URL, exactly
        sync: false
      - key: SEED_ENABLED
        value: "true"        # idempotent; skips when the catalogue is populated
      - key: RATE_LIMIT_RPM
        value: "60"

  - type: web
    name: vehicle-search
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Vite inlines this at build time, so changing it needs a rebuild, not a
      # restart.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Client-side routing: every unmatched path serves the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
